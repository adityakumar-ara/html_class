<!-- ::before -->
<!DOCTYPE html>
<html>
<head>
  <title>Pseudo Element</title>

  <style>
    /* Before text */
    p::before {
      content: "👉 ";
      color: red;
      font-weight: bold;
    }

    /* After text */
    p::after {
      content: " 👈";
      color: blue;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <p>Hello World</p>
  <p>Hello aditya</p>
  <p>Hello World</p>
  <p>Hello World</p>
  <p>Hello World</p>
</body>
</html>
